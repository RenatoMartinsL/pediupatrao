# Configurando a conexão com MongoDB enquanto repositório de dados
# Se MONGODB_URI não for informada, usa o MongoDB local (ex.: docker compose up mongo)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.database=pizzaria

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Fuso horário usado nos registros de entrada, saída e auditoria
spring.jackson.time-zone=America/Sao_Paulo

# Não expor detalhes internos de exceções nas respostas
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.com.umc.pediupatrao=INFO
