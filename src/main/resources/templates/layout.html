<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Token CSRF usado pelas chamadas fetch -->
        <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
        <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''">
        <title>PediuPatrão</title>
        <link rel="icon" th:href="@{/images/logo.png}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <script>
            // Uso: fetch(url, { method: 'POST', headers: csrfHeaders() })
            function csrfHeaders(extra) {
                const token = document.querySelector('meta[name="_csrf"]').content;
                const header = document.querySelector('meta[name="_csrf_header"]').content;
                return Object.assign({ [header]: token }, extra || {});
            }
        </script>
    </head>
    <body>
        <button type="button" class="toggle-btn btn btn-dark" aria-label="Abrir menu">
            <i class="bi bi-list"></i>
        </button>

        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <main class="container-fluid">
            <div th:replace="~{__${content}__}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
