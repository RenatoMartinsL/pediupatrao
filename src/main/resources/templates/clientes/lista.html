<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="cabecalho">
        <h2 class="mb-0">
            Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <div th:replace="~{fragments/alertas :: alertas}"></div>

    <!-- Tabela de clientes (renderizada no servidor; o texto é escapado pelo Thymeleaf) -->
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4" sec:authorize="hasRole('ATENDENTE')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.nome}"></td>
                        <td th:text="${cliente.telefone}"></td>
                        <td th:text="${cliente.enderecoFormatado}"></td>
                        <td class="text-end pe-4" sec:authorize="hasRole('ATENDENTE')">
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </a>
                            <form th:action="@{/clientes/excluir/{id}(id=${cliente.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Tem certeza que deseja excluir este cliente?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash-fill"></i> Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
