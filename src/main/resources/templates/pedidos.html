<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content">

    <div class="cabecalho">
        <div>
            <h2>Pedidos</h2>
            <div class="sub">Clique em um pedido para ver detalhes e mudar o status.</div>
        </div>
        <a href="/pedidos/novo" class="btn btn-primary" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i>Novo pedido
        </a>
    </div>

    <div th:replace="~{fragments/alertas :: alertas}"></div>

    <!-- Quadro com os pedidos em aberto -->
    <div class="quadro mb-5">
        <div class="coluna" th:each="coluna : ${colunas}">
            <h6>
                <span th:text="${coluna.titulo}"></span>
                <span th:text="${#lists.size(coluna.pedidos)}"></span>
            </h6>
            <a class="cartao-pedido" th:each="pedido : ${coluna.pedidos}" th:href="@{/pedidos/{id}(id=${pedido.id})}">
                <div class="d-flex justify-content-between">
                    <span class="cliente" th:text="${pedido.clienteNome}"></span>
                    <span th:text="${#temporals.format(pedido.dataHoraEntrada, 'HH:mm')}"></span>
                </div>
                <div class="text-muted small" th:each="item : ${pedido.itens}"
                     th:text="${item.quantidade + 'x ' + item.nomeProduto}"></div>
                <div class="rodape">
                    <span th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></span>
                    <span th:if="${pedido.status.isSaida()}" th:text="${pedido.status.descricao}"></span>
                </div>
            </a>
            <div class="text-muted small px-1" th:if="${#lists.isEmpty(coluna.pedidos)}">Nada por aqui.</div>
        </div>
    </div>

    <!-- Encerrados -->
    <h5 class="mb-3">Encerrados</h5>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Entrada</th>
                        <th>Cliente</th>
                        <th class="text-end">Total</th>
                        <th>Status</th>
                        <th>Saída</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(encerrados)}">
                        <td colspan="6" class="text-center text-muted py-4">Nenhum pedido encerrado ainda.</td>
                    </tr>
                    <tr th:each="pedido : ${encerrados}">
                        <td class="text-nowrap" th:text="${#temporals.format(pedido.dataHoraEntrada, 'dd/MM HH:mm')}"></td>
                        <td th:text="${pedido.clienteNome}"></td>
                        <td class="text-end text-nowrap" th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td><span th:replace="~{fragments/alertas :: badgeStatus(${pedido.status})}"></span></td>
                        <td class="small text-nowrap">
                            <span th:if="${pedido.dataHoraSaida != null}"
                                  th:text="|${#temporals.format(pedido.dataHoraSaida, 'dd/MM HH:mm')} por ${pedido.responsavelSaida}|"></span>
                            <span th:if="${pedido.dataHoraSaida == null}" class="text-muted">não saiu</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-primary">Abrir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
