<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | PediuPatrão</title>
    <link rel="icon" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="pagina-login">
        <div class="lado-marca">
            <img th:src="@{/images/logo.png}" alt="PediuPatrão">
            <h1>PediuPatrão</h1>
            <p class="mb-0 opacity-75">Pedidos da pizzaria, do balcão à entrega.</p>
        </div>

        <div class="lado-form">
            <form th:action="@{/login}" method="post">
                <h2 class="mb-1">Entrar</h2>
                <p class="text-muted mb-4">Use o seu usuário da pizzaria.</p>

                <div class="alert alert-danger py-2" th:if="${param.error}">Usuário ou senha incorretos.</div>
                <div class="alert alert-secondary py-2" th:if="${param.logout}">Você saiu do sistema.</div>

                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
