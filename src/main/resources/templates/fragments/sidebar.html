<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <body>
        <!-- O menu só esconde o que o perfil não usa; quem bloqueia de verdade é o backend -->
        <div th:fragment="sidebar">
            <nav id="sidebar">
                <div class="marca">
                    <img th:src="@{/images/logo.png}" alt="">
                    <span>PediuPatrão</span>
                </div>

                <div class="quem" sec:authorize="isAuthenticated()">
                    <div><i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></div>
                    <span class="perfil" th:text="${perfilLogado}"></span>
                </div>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house"></i>Início</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','GERENTE','ATENDENTE')">
                        <a class="nav-link" th:href="@{/pedidos}"><i class="bi bi-receipt"></i>Pedidos</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
                        <a class="nav-link" th:href="@{/clientes}"><i class="bi bi-people"></i>Clientes</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','GERENTE','ATENDENTE')">
                        <a class="nav-link" th:href="@{/produtos}"><i class="bi bi-card-list"></i>Cardápio</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','GERENTE')">
                        <a class="nav-link" th:href="@{/auditoria}"><i class="bi bi-clock-history"></i>Auditoria</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/usuarios}"><i class="bi bi-shield-lock"></i>Usuários</a>
                    </li>
                </ul>

                <form class="sair" th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                    <button type="submit"><i class="bi bi-box-arrow-left me-1"></i>Sair</button>
                </form>
            </nav>
        </div>
    </body>
</html>
